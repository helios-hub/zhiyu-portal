<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>信息列表 - 智遇灵搭（重庆）科技有限公司</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <div class="crumbs"><a href="index.html">首页</a> &gt; <span id="crumb">全部信息</span></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="results"></div>
    <nav class="pager" id="pager" aria-label="分页"></nav>
  </main>
  <footer id="site-footer"></footer>

  <script src="static/js/data.js"></script>
  <script src="static/js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const cat = App.catOf(params.get('cat')) ? params.get('cat') : '';
    const page = Math.max(1, parseInt(params.get('page'), 10) || 1);
    const PER = 15;
    App.layout(cat || 'list');

    const link = (o) => {
      const p = new URLSearchParams();
      const v = { cat, page: 1, ...o };
      Object.entries(v).forEach(([k, val]) => { if (val && !(k === 'page' && val === 1)) p.set(k, val); });
      return 'list.html' + (p.toString() ? '?' + p : '');
    };

    document.getElementById('filters').innerHTML =
      `<a href="${link({ cat: '' })}" class="${cat ? '' : 'active'}">全部</a>` +
      App.cats().map((c) => `<a href="${link({ cat: c.id })}" class="${c.id === cat ? 'active' : ''}">${App.esc(c.name)}</a>`).join('');

    const found = App.posts().filter((p) => !cat || p.cat === cat);
    const pages = Math.max(1, Math.ceil(found.length / PER));
    const cur = Math.min(page, pages);

    document.getElementById('crumb').textContent =
      (cat ? App.catOf(cat).name : '全部信息') + `(${found.length}条)`;
    document.title = `${cat ? App.catOf(cat).name : '信息列表'} - 智遇灵搭（重庆）科技有限公司`;
    document.getElementById('results').innerHTML =
      found.slice((cur - 1) * PER, cur * PER).map(App.card).join('') || '<p class="empty" style="grid-column:1/-1">没有找到相关信息</p>';

    let pg = '';
    for (let i = 1; i <= pages && pages > 1; i++) {
      pg += i === cur ? `<span class="cur" aria-current="page">${i}</span>` : `<a href="${link({ page: i })}">${i}</a>`;
    }
    document.getElementById('pager').innerHTML = pg;
  </script>
</body>
</html>
