<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 - 智遇灵搭（重庆）科技有限公司</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <form class="panel form-card" id="form" novalidate>
      <h1>会员注册</h1>
      <div id="msg" role="alert"></div>
      <div class="field"><label for="name">用户名</label><input id="name" autocomplete="username" required>
        <div class="hint">3-20位,可用字母、数字、下划线、汉字</div></div>
      <div class="field"><label for="pw">密码</label><input id="pw" type="password" autocomplete="new-password" required>
        <div class="hint">至少8位</div></div>
      <div class="field"><label for="pw2">确认密码</label><input id="pw2" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-primary" type="submit">注册</button>
      <p>已有账号?<a href="login.html" style="color:var(--blue)">去登录</a></p>
    </form>
  </main>
  <footer id="site-footer"></footer>

  <script src="static/js/data.js"></script>
  <script src="static/js/app.js"></script>
  <script>
    App.layout('');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const pw = document.getElementById('pw').value;
      try {
        if (pw !== document.getElementById('pw2').value) throw new Error('两次输入的密码不一致');
        await App.register(document.getElementById('name').value.trim(), pw);
        location.href = 'member.html';
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
